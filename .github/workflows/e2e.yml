name: Browser trial

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    name: Local production browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      LAUNCHLENS_PROVIDER_LIVE_ENABLED: "false"
      PLAYWRIGHT_PRODUCTION: "1"
      DATABASE_URL: ""
      POSTGRES_URL: ""
      NEON_DATABASE_URL: ""
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e -- --retries=0
      - name: Save failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: test-results/
          retention-days: 7
